version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cmp-postgres
    environment:
      POSTGRES_USER: cmp_user
      POSTGRES_PASSWORD: cmp_password
      POSTGRES_DB: cloud_migration_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cmp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmp-api
    environment:
      FLASK_APP: src/api/app.py
      FLASK_ENV: development
      DATABASE_URL: postgresql://cmp_user:cmp_password@postgres:5432/cloud_migration_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: flask run --host=0.0.0.0

  # Node.js Web Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: cmp-web
    ports:
      - "3000:3000"
    volumes:
      - ./src/web:/app/src
    depends_on:
      - api
    environment:
      REACT_APP_API_URL: http://localhost:5000

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cmp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data: