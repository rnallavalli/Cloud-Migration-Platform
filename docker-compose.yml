version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cmp-postgres
    environment:
      POSTGRES_USER: cmp_user
      POSTGRES_PASSWORD: cmp_password
      POSTGRES_DB: cloud_migration_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cmp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmp-api
    environment:
      FLASK_APP: src.api.app
      FLASK_ENV: development
      PYTHONPATH: /app
      DATABASE_URL: postgresql://cmp_user:cmp_password@postgres:5432/cloud_migration_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m flask run --host=0.0.0.0 --port=5000

  # Node.js Web Frontend
  web:
    build:
      context: ./src/web
      dockerfile: ../../Dockerfile.web
    container_name: cmp-web
    ports:
      - "4000:3000"
    depends_on:
      - api

volumes:
  postgres_data: